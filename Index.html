<!DOCTYPE html>
<html>

<head>
    <title>Tennis Court Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Tennis Court Scheduler</h1>

    <div class="container">

        <div class="section">
            <h2>Select Court</h2>
            <select id="courtSelect"></select>
        </div>

        <div class="section">
            <h2>Select Team</h2>
            <select id="teamSelect"></select>
        </div>

        <div class="section">
            <h2>Select Time</h2>
            <input type="time" id="startTime">
            <input type="time" id="endTime">
        </div>

        <button id="bookBtn">Book Court</button>

        <h2>Schedule</h2>
        <div id="schedule"></div>

    </div>

    <script src="app.js"></script>
</body>

</html>
